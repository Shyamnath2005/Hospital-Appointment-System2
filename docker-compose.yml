version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: hospital-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hospital_db
    volumes:
      - mongo_data:/data/db
    networks:
      - hospital-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    image: hospital-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/hospital_db
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRE: 7d
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-hospital-patient-documents}
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hospital-net
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: wget -qO- http://127.0.0.1:5000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: hospital-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hospital-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: wget -qO- http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mongo_data:
    driver: local
  backend_logs:
    driver: local

networks:
  hospital-net:
    driver: bridge
